<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="dsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#dsGrad)" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="82" fill="#0f172a" />
  
  <!-- Outer decorative ring -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="url(#dsGrad)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Center Emblem: Digital / Citizen Service Motif -->
  <!-- Stylized Shield & Document -->
  <path d="M100 48 L138 64 V102 C138 126 122 146 100 154 C78 146 62 126 62 102 V64 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Document & Check Lines inside shield -->
  <rect x="82" y="74" width="36" height="46" rx="4" fill="none" stroke="#f8fafc" stroke-width="3" />
  <line x1="90" y1="84" x2="110" y2="84" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="90" y1="94" x2="110" y2="94" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="104" x2="104" y2="104" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Checkmark badge -->
  <circle cx="116" cy="118" r="14" fill="#10b981" />
  <path d="M110 118 L114 122 L123 113" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
